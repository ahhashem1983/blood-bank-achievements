<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blood Bank Achievements 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f8fa;--card:#fff;--ink:#102338;--mut:#4f6d82;--line:#d3e1e8;--hd:#0a3352;--soft:#e2eef2;--blue:#1c6f91;--teal:#0fa8bb;--green:#12876e;--red:#d92d20;--gold:#9c7a2e;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081a29;--card:#0e2d42;--ink:#e6f2f6;--mut:#89adbf;--line:#1c4258;--hd:#7fc8e3;--soft:#123448;--blue:#4da6cc;--teal:#3ddceb;--green:#3ecda8;--red:#ff7a70;--gold:#e3c076;--on:#081a29}}
:root[data-theme="dark"]{--bg:#081a29;--card:#0e2d42;--ink:#e6f2f6;--mut:#89adbf;--line:#1c4258;--hd:#7fc8e3;--soft:#123448;--blue:#4da6cc;--teal:#3ddceb;--green:#3ecda8;--red:#ff7a70;--gold:#e3c076;--on:#081a29}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.br{display:flex;align-items:center;font-weight:700;color:var(--hd)}
.hlogo{width:30px;height:30px;margin-right:10px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.bt{border:1px solid var(--line);background:var(--card);color:var(--hd);padding:8px 14px;border-radius:999px;font-weight:600}
.bt.pri,.bt.on{background:var(--blue);color:var(--on);border-color:var(--blue)}
.bt.sm{padding:5px 12px;font-size:13px;margin-top:6px}
.bt:disabled{opacity:.4;cursor:default}
nav{display:flex;gap:8px;max-width:760px;margin:12px auto 0;padding:0 16px}
main{max-width:760px;margin:0 auto;padding:12px 16px 96px}
main:focus{outline:0}
#v>*{animation:up .3s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.hero{margin-bottom:18px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#0a3352,#128aa3);color:#fff}
.hero small{opacity:.85;font-size:12px}
.hero h1{margin:6px 0;font-size:26px;line-height:1.15}
.hero p{margin:0 0 12px;opacity:.92}
.ch span{display:inline-block;margin:0 6px 6px 0;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:600}
.rail{position:relative;padding-left:26px}
.rail:before{content:"";position:absolute;left:8px;top:8px;bottom:14px;width:4px;border-radius:2px;background:linear-gradient(var(--blue),var(--teal),var(--green))}
.node{position:relative;display:flex;gap:12px;width:100%;margin:0 0 14px;padding:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px}
.node:before{content:"";position:absolute;left:-18px;top:30px;width:18px;height:4px;background:var(--teal)}
.node:hover,.node:focus-visible{border-color:var(--blue);outline:0;box-shadow:0 0 0 3px var(--soft)}
.node.seen{border-color:var(--green)}
.n{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:var(--on);font-weight:700}
.seen .n{background:var(--green)}
.t{flex:1;min-width:0}
.t small{color:var(--mut);font-weight:700;letter-spacing:.05em;font-size:11px}
.t>b{display:block;color:var(--hd);font-size:16px;line-height:1.25}
.t em{display:block;margin:2px 0 4px;font-style:normal;font-size:13px;color:var(--mut)}
.trk{position:relative;height:10px;margin:22px 0 4px;background:var(--soft);border-radius:6px}
.cup{position:absolute;right:0;top:-20px;font-size:16px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.trk .f{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--teal))}
.trk .g{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.trk .s{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;border:2px solid var(--ink);border-radius:50%;background:var(--card)}
.lg{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.lg strong{color:var(--green)}
.sw{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:3px}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:14px 0}
.tl{padding:12px 8px;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px}
.tl b{display:block;font-size:26px;line-height:1.15}
.tl span{font-size:12px;font-weight:600;color:var(--mut)}
.cd{margin:12px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.cd h3,.cd summary{margin:0 0 8px;font-size:15px;color:var(--hd);font-weight:700}
.cd summary{cursor:pointer}
.cd p{margin:6px 0}
.cd ul{margin:0;padding-left:20px}
.st{margin:20px 0 4px;color:var(--hd);font-size:17px}
.sub{margin:0;color:var(--mut);font-size:13.5px}
.bk{border:0;background:none;color:var(--blue);font-weight:700;padding:6px 0}
.bh{display:flex;gap:12px;align-items:center;margin:6px 0 12px}
.bh h2{margin:0;font-size:20px;line-height:1.2;color:var(--hd)}
.bh small{color:var(--mut);font-weight:700}
.tb{display:flex;gap:8px;flex-wrap:wrap}
.kh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--green);background:var(--soft)}
.kn{margin:4px 0 0;font-size:13.5px}
.co{margin:12px 0;padding:12px 14px;border-left:4px solid var(--teal);border-radius:0 12px 12px 0;background:var(--soft);color:var(--hd);font-weight:600}
.hb{margin:10px 0}
.hl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.hw{height:12px;margin-top:4px;background:var(--soft);border-radius:6px;overflow:hidden}
.hw div{height:100%;border-radius:6px}
.bars{display:flex;align-items:flex-end;gap:16px;margin:14px 4px 2px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;flex:1;min-width:62px}
.col b{font-size:13px;font-weight:700;color:var(--hd);margin-bottom:6px}
.col i{display:block;width:100%;max-width:46px;border-radius:8px 8px 4px 4px}
.col span{margin-top:8px;font-size:11px;color:var(--mut);text-align:center;line-height:1.3}
.cp{display:inline-block;margin:0 6px 6px 0;padding:4px 12px;border:1.5px solid;border-radius:999px;font-size:13px;font-weight:600}
.ok{color:var(--green)}
.nx{color:var(--gold)}
.ac{display:flex;justify-content:space-between;gap:8px;margin-top:22px}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
#pg{font-size:12.5px;color:var(--mut);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

draw();scrollTo(0,0);$('#v').focus({preventScroll:true});}
const step=d=>go(ORD[Math.min(ORD.length-1,Math.max(0,ORD.indexOf(cur)+d))]);
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!=cur)go(h)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-step]');if(!b)return;b.dataset.step?step(+b.dataset.step):go(b.dataset.go,b.dataset.t)});
addEventListener('keydown',e=>{if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1)});
$('#th').onclick=()=>{const r=document.documentElement,c=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=c=='dark'?'light':'dark'};
go(location.hash.slice(1)||'home');
</script>
</body>
